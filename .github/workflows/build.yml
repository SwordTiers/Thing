

name: Build Donut Client

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          echo "Repository contents:"
          ls -la

          WRAPPER=$(find . -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No Unix Gradle wrapper (gradlew) found."
            echo "Searching for Windows wrapper and Gradle build files:"
            find . -maxdepth 6 \( \
              -name gradlew.bat -o \
              -name build.gradle -o \
              -name build.gradle.kts -o \
              -name settings.gradle -o \
              -name settings.gradle.kts \
            \) -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          PROJECT_DIR=${PROJECT_DIR#./}

          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR=""
          fi

          echo "Found Gradle wrapper: $WRAPPER"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build JAR
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Upload JAR files
        uses: actions/upload-artifact@v4
        with:
          name: Donut-Client-JAR
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
